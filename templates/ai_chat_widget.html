<!-- AI 客服悬浮聊天组件 —— 在 body 结束前用 include 引用 -->
<style>
.chat-widget-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* 悬浮按钮 */
.chat-widget-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
  color: #fff;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(41, 128, 185, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  transition: transform 0.25s, box-shadow 0.25s;
  position: relative;
}
.chat-widget-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(41, 128, 185, 0.55);
}
.chat-widget-btn:active {
  transform: scale(0.95);
}

/* 按钮图标 —— 聊天气泡 SVG */
.chat-widget-btn .icon-chat {
  width: 28px;
  height: 28px;
}
.chat-widget-btn .icon-close-widget {
  display: none;
  width: 22px;
  height: 22px;
}
.chat-widget-container.open .chat-widget-btn .icon-chat {
  display: none;
}
.chat-widget-container.open .chat-widget-btn .icon-close-widget {
  display: block;
}

/* 未读指示点 */
.chat-widget-btn .unread-dot {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #e74c3c;
  border: 2px solid #fff;
  display: none;
}
.chat-widget-container.has-unread .chat-widget-btn .unread-dot {
  display: block;
}

/* 聊天窗口 */
.chat-widget-window {
  position: absolute;
  bottom: 76px;
  right: 0;
  width: 380px;
  height: 520px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.16);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform-origin: bottom right;
  transform: scale(0);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s;
}
.chat-widget-container.open .chat-widget-window {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}

/* 头部 */
.chat-widget-header {
  background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
  color: #fff;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.chat-widget-header .status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #4ade80;
  animation: cw-pulse 2s infinite;
}
@keyframes cw-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.chat-widget-header .title {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
}
.chat-widget-header .btn-minimize {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  line-height: 1;
}
.chat-widget-header .btn-minimize:hover {
  background: rgba(255, 255, 255, 0.28);
}

/* 消息区域 */
.chat-widget-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #f8fafc;
}
.chat-widget-messages::-webkit-scrollbar {
  width: 5px;
}
.chat-widget-messages::-webkit-scrollbar-thumb {
  background: #d1d5db;
  border-radius: 10px;
}

/* 消息气泡 */
.cw-message {
  display: flex;
  gap: 8px;
  max-width: 88%;
  animation: cw-slideIn 0.3s ease;
}
@keyframes cw-slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.cw-message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.cw-message .cw-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.cw-message.assistant .cw-avatar {
  background: #dbeafe;
  color: #2563eb;
}
.cw-message.user .cw-avatar {
  background: #d4edda;
  color: #27ae60;
}
.cw-message .cw-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  line-height: 1.55;
  word-break: break-word;
  font-size: 14px;
}
.cw-message.assistant .cw-bubble {
  background: #fff;
  color: #1f2937;
  border: 1px solid #e5e7eb;
  border-bottom-left-radius: 4px;
}
.cw-message.user .cw-bubble {
  background: #2980b9;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.cw-message .cw-bubble p { margin: 0; }
.cw-message .cw-bubble p + p { margin-top: 6px; }

/* 打字指示器 */
.cw-typing {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}
.cw-typing span {
  width: 7px;
  height: 7px;
  background: #9ca3af;
  border-radius: 50%;
  animation: cw-bounce 1.4s infinite ease-in-out;
}
.cw-typing span:nth-child(2) { animation-delay: 0.2s; }
.cw-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes cw-bounce {
  0%, 80%, 100% { transform: scale(0.6); }
  40% { transform: scale(1); }
}

/* 输入区域 */
.chat-widget-input-area {
  padding: 12px 16px;
  border-top: 1px solid #e5e7eb;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: #fff;
  flex-shrink: 0;
}
.chat-widget-input-area textarea {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  padding: 10px 14px;
  resize: none;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.4;
  max-height: 100px;
  outline: none;
  transition: border-color 0.2s;
}
.chat-widget-input-area textarea:focus {
  border-color: #2980b9;
  box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.12);
}
.chat-widget-input-area .btn-send {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  background: #2980b9;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chat-widget-input-area .btn-send:hover {
  background: #1a5276;
}
.chat-widget-input-area .btn-send:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

/* 移动端全屏 */
@media (max-width: 500px) {
  .chat-widget-container {
    bottom: 0;
    right: 0;
  }
  .chat-widget-btn {
    width: 52px;
    height: 52px;
    bottom: 16px;
    right: 16px;
    position: fixed;
  }
  .chat-widget-window {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 100vw;
    height: 100vh;
    max-height: 100dvh;
    border-radius: 0;
  }
  .chat-widget-container.open .chat-widget-btn {
    bottom: auto;
    top: 6px;
    right: 6px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    position: fixed;
  }
}
</style>

<div class="chat-widget-container" id="chatWidget">
  <button class="chat-widget-btn" id="chatBtn" title="AI 助手">
    <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <svg class="icon-close-widget" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    <span class="unread-dot"></span>
  </button>

  <div class="chat-widget-window">
    <div class="chat-widget-header">
      <span class="status-dot"></span>
      <span class="title">AI 实验助手</span>
      <button class="btn-minimize" id="btnMinimize" title="关闭">✕</button>
    </div>

    <div class="chat-widget-messages" id="cwMessages">
      <div class="cw-message assistant">
        <div class="cw-avatar">🤖</div>
        <div class="cw-bubble">你好！我是实验室资产管理助手。<br>有什么可以帮助你的吗？</div>
      </div>
    </div>

    <div class="chat-widget-input-area">
      <textarea id="cwInput" rows="1" placeholder="输入你的问题..."></textarea>
      <button class="btn-send" id="cwSendBtn" title="发送">➤</button>
    </div>
  </div>
</div>

<script>
(function() {
  var container = document.getElementById('chatWidget');
  var chatBtn = document.getElementById('chatBtn');
  var btnMinimize = document.getElementById('btnMinimize');
  var messagesEl = document.getElementById('cwMessages');
  var inputEl = document.getElementById('cwInput');
  var sendBtn = document.getElementById('cwSendBtn');

  var messages = [];
  var isStreaming = false;
  var isOpen = false;

  function toggleChat() {
    isOpen = !isOpen;
    if (isOpen) {
      container.classList.add('open');
      container.classList.remove('has-unread');
      inputEl.focus();
    } else {
      container.classList.remove('open');
    }
  }

  chatBtn.addEventListener('click', toggleChat);
  btnMinimize.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleChat();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isOpen) {
      toggleChat();
    }
  });

  inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function escapeHtml(text) {
    var el = document.createElement('span');
    el.textContent = text;
    return el.innerHTML;
  }

  function appendMessage(role, content) {
    var div = document.createElement('div');
    div.className = 'cw-message ' + role;
    var avatar = role === 'user' ? '👤' : '🤖';
    div.innerHTML =
      '<div class="cw-avatar">' + avatar + '</div>' +
      '<div class="cw-bubble">' + escapeHtml(content) + '</div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div.querySelector('.cw-bubble');
  }

  function showTyping() {
    var div = document.createElement('div');
    div.className = 'cw-message assistant';
    div.id = 'cwTyping';
    div.innerHTML =
      '<div class="cw-avatar">🤖</div>' +
      '<div class="cw-bubble"><div class="cw-typing"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    var el = document.getElementById('cwTyping');
    if (el) el.remove();
  }

  async function sendMessage() {
    if (isStreaming) return;
    var content = inputEl.value.trim();
    if (!content) return;

    isStreaming = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    if (!isOpen) {
      toggleChat();
    }

    appendMessage('user', content);
    messages.push({ role: 'user', content: content });

    showTyping();

    try {
      var response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages })
      });

      if (!response.ok) throw new Error('请求失败');

      hideTyping();
      var bubble = appendMessage('assistant', '');
      var fullText = '';

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      while (true) {
        var result = await reader.read();
        if (result.done) break;
        var text = decoder.decode(result.value, { stream: true });
        fullText += text;
        bubble.innerHTML = escapeHtml(fullText);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      messages.push({ role: 'assistant', content: fullText });
    } catch (err) {
      hideTyping();
      appendMessage('assistant', '抱歉，连接出现问题，请稍后重试。');
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
})();
</script>
